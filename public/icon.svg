<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="286" r="140" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Paraglider Wing Arc -->
  <path d="M 68 180 C 130 90, 382 90, 444 180 C 370 148, 142 148, 68 180 Z" fill="url(#wingGrad)" filter="url(#glow)"/>
  <path d="M 120 162 C 190 120, 322 120, 392 162 C 340 140, 172 140, 120 162 Z" fill="#e0f2fe" opacity="0.6"/>

  <!-- Suspension Lines -->
  <g stroke="#94a3b8" stroke-width="2.5" opacity="0.85">
    <line x1="88" y1="175" x2="256" y2="280"/>
    <line x1="160" y1="150" x2="256" y2="280"/>
    <line x1="220" y1="140" x2="256" y2="280"/>
    <line x1="292" y1="140" x2="256" y2="280"/>
    <line x1="352" y1="150" x2="256" y2="280"/>
    <line x1="424" y1="175" x2="256" y2="280"/>
  </g>

  <!-- Paramotor Hoop / Cage -->
  <circle cx="256" cy="305" r="92" fill="#0f172a" stroke="url(#wingGrad)" stroke-width="8"/>
  <circle cx="256" cy="305" r="76" fill="none" stroke="#1e293b" stroke-width="3"/>

  <!-- Two-Blade Propeller -->
  <g transform="translate(256, 305) rotate(35)">
    <path d="M -70 -7 C -30 -16, 30 -16, 70 -7 C 76 -2, 76 2, 70 7 C 30 16, -30 16, -70 7 C -76 2, -76 -2, -70 -7 Z" fill="url(#accentGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- Pilot Silhouette in Harness -->
  <circle cx="256" cy="275" r="13" fill="#f8fafc"/>
  <path d="M 248 290 C 248 286, 264 286, 264 290 L 268 316 C 268 322, 244 322, 244 316 Z" fill="#38bdf8"/>
  
  <!-- Altitude / Thrust Indicator Waves -->
  <path d="M 210 428 L 302 428" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <path d="M 232 444 L 280 444" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
</svg>
